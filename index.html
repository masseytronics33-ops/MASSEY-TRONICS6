<script>
window.fd1=null; window.fd2=null; window.db=null; window.stream=null;
let req=indexedDB.open("MASSEY_FINAL_48_ADSTERRA",1);
req.onupgradeneeded=function(e){
  let d=e.target.result;
  d.createObjectStore("accounts",{keyPath:"phone"});
  d.createObjectStore("games",{autoIncrement:true});
  d.createObjectStore("it",{autoIncrement:true});
  d.createObjectStore("gamb",{autoIncrement:true});
  d.createObjectStore("ads",{autoIncrement:true});
};
req.onsuccess=function(e){ window.db=e.target.result; window.loadAll(); };
window.startCamera=async function(n){
  try{
    let v=document.getElementById('v'+n);
    let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
    window.stream=s; v.srcObject=s; v.style.display='block'; await v.play();
    document.getElementById('ph'+n).style.display='none';
    document.getElementById('ov'+n).style.display='block';
    document.getElementById('c'+n).style.display='none';
    document.getElementById('t'+n).style.display='block';
  }catch(err){ alert('Camera: http://localhost:8000 - '+err.message); }
};
window.capture=function(n){
  let v=document.getElementById('v'+n);
  if(v.videoWidth==0){ alert('Subiri'); return; }
  let c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  let data=c.toDataURL('image/jpeg',0.7);
  if(n==1) window.fd1=data; else window.fd2=data;
  document.getElementById('fb'+n).innerHTML='<img src="'+data+'" style="width:100%;height:100%;object-fit:cover">';
  if(window.stream) window.stream.getTracks().forEach(t=>t.stop());
};
window.signup=function(){
  let name=document.getElementById('sName').value, phone=document.getElementById('sPhone').value;
  if(!name||!phone||!window.fd1){ alert('Jaza zote'); return; }
  let isAdmin=name.toLowerCase().includes('massey');
  window.db.transaction("accounts","readwrite").objectStore("accounts").put({name,phone,face:window.fd1,isAdmin}).onsuccess=function(){ localStorage.setItem('cur',phone); location.reload(); };
};
window.login=function(){
  let phone=document.getElementById('lPhone').value;
  if(!phone||!window.fd2){ alert('Jaza'); return; }
  window.db.transaction("accounts","readonly").objectStore("accounts").get(phone).onsuccess=function(e){
    if(!e.target.result){ alert('Haipo'); return; }
    localStorage.setItem('cur',phone); location.reload();
  };
};
window.enter=function(){
  let phone=localStorage.getItem('cur'); if(!phone||!window.db) return;
  window.db.transaction("accounts","readonly").objectStore("accounts").get(phone).onsuccess=function(e){
    let a=e.target.result; if(!a) return;
    document.getElementById('authPage').style.display='none';
    document.getElementById('system').style.display='block';
    document.getElementById('pName').innerText=a.name;
    document.getElementById('pPhone').innerText=a.phone;
    document.getElementById('pImg').src=a.face;
    document.getElementById('topName').innerText=a.name+(a.isAdmin?' (ADMIN)':'');
    if(a.isAdmin) document.getElementById('mAdmin').style.display='block';
    window.loadAll();
  };
};
window.uploadGame=function(){
  let name=document.getElementById('adName').value, price=document.getElementById('adPrice').value, cat=document.getElementById('adCat').value;
  if(!name) return alert('Jaza');
  window.db.transaction("games","readwrite").objectStore("games").add({name,price,cat,time:Date.now()}).onsuccess=function(){ window.ok(name); };
};
window.uploadIt=function(){
  let name=document.getElementById('itName').value, price=document.getElementById('itPrice').value;
  if(!name) return alert('Jaza');
  window.db.transaction("it","readwrite").objectStore("it").add({name,price,time:Date.now()}).onsuccess=function(){ window.ok(name); };
};
window.uploadGamb=function(){
  let name=document.getElementById('gName').value, price=document.getElementById('gOdds').value, time=document.getElementById('gTime').value;
  if(!name) return alert('Jaza');
  window.db.transaction("gamb","readwrite").objectStore("gamb").add({name,price,time,timeStamp:Date.now()}).onsuccess=function(){ window.ok(name); };
};
window.uploadAds=function(){
  let title=document.getElementById('adsTitle').value, desc=document.getElementById('adsDesc').value, link=document.getElementById('adsLink').value, pay=document.getElementById('adsPay').value, pos=document.getElementById('adsPos').value;
  if(!title){ alert('Jina'); return; }
  if(!pay) pay="20000";
  let tx=window.db.transaction("ads","readwrite");
  tx.objectStore("ads").add({title,desc,link,pay,pos,time:Date.now()});
  tx.oncomplete=function(){
    let s=document.getElementById('adStatus'); s.style.display='block'; s.innerHTML='✅ '+title+' imewekwa TZS '+pay; window.loadAll(); window.mainTab('home');
  };
};
window.ok=function(m){ let s=document.getElementById('adStatus'); s.style.display='block'; s.innerHTML='✅ '+m+' imewekwa!'; window.loadAll(); };
window.loadAll=function(){
  if(!window.db) return;
  window.db.transaction("games","readonly").objectStore("games").getAll().onsuccess=function(e){
    let g=e.target.result;
    document.getElementById('gGrid').innerHTML=g.length?g.map(function(x){ return '<div class="item"><b>'+x.name+'</b><br><small>'+x.price+'</small><br><small style="color:#facc15">'+x.cat.toUpperCase()+'</small></div>'; }).join(''):'<div style="grid-column:1/3;text-align:center;color:#555;padding:20px">Hakuna Games - ADMIN weka</div>';
  };
  window.db.transaction("ads","readonly").objectStore("ads").getAll().onsuccess=function(e){
    let ads=e.target.result;
    let box=document.getElementById('adBoxTop');
    if(ads.length>0){
      box.style.display='block'; box.style.borderStyle='solid';
      let topAd=ads.find(function(a){ return a.pos=='top'; })||ads[0];
      document.getElementById('topAdContainer').innerHTML='<a href="'+topAd.link+'" target="_blank" style="text-decoration:none"><div style="background:#facc15;color:#000;padding:14px;border-radius:10px;font-weight:bold;text-align:left"><div style="font-size:13px">'+topAd.title+'</div><div style="font-size:11px;font-weight:normal">'+topAd.desc+'</div><div style="font-size:10px;background:#000;color:#facc15;padding:4px 10px;border-radius:15px;display:inline-block;margin-top:6px">TZS '+topAd.pay+'</div></div></a>';
    } else {
      // Kama kuna AdSterra code, onyesha box, kama hakuna, ficha
      let hasAdsterra = document.getElementById('topAdContainer').innerHTML.includes('atOptions') || document.getElementById('topAdContainer').innerHTML.includes('highperformance');
      if(!hasAdsterra) box.style.display='none';
    }
  };
};
window.switchAuth=function(id){
  document.getElementById('signupPage').style.display=id=='signup'?'block':'none';
  document.getElementById('loginPage').style.display=id=='login'?'block':'none';
  document.getElementById('bSign').className=id=='signup'?'a-btn on':'a-btn off';
  document.getElementById('bLog').className=id=='login'?'a-btn on':'a-btn off';
};
window.mainTab=function(id){
  document.querySelectorAll('.mainSec').forEach(function(c){ c.style.display='none'; });
  document.getElementById(id).style.display='block';
  document.querySelectorAll('.m-tab').forEach(function(t){ t.classList.remove('active'); t.classList.add('off'); });
  let el=document.getElementById('m'+id.charAt(0).toUpperCase()+id.slice(1));
  if(el){ el.classList.add('active'); el.classList.remove('off'); }
};
window.homeTab=function(id){
  document.querySelectorAll('.homeSec').forEach(function(c){ c.style.display='none'; });
  document.getElementById(id).style.display='block';
  document.querySelectorAll('.h-tab').forEach(function(t){ t.classList.remove('active'); t.classList.add('off'); });
  let el=document.getElementById('h'+id.charAt(0).toUpperCase()+id.slice(1));
  if(el) el.classList.add('active');
};
window.adminTab=function(id){
  ['adGames','adIt','adGamb','adAds'].forEach(function(s){ let el=document.getElementById(s); if(el) el.style.display='none'; });
  let map={games:'adGames',it:'adIt',gamb:'adGamb',ads:'adAds'};
  let toShow=document.getElementById(map[id]);
  if(toShow) toShow.style.display='block';
  document.querySelectorAll('.ad-tab').forEach(function(t){ t.classList.remove('on'); t.classList.add('off'); });
  let mapBtn={games:'tabG',it:'tabI',gamb:'tabGa',ads:'tabAd'};
  let btn=document.getElementById(mapBtn[id]);
  if(btn){ btn.classList.add('on'); btn.classList.remove('off'); }
};
window.logout=function(){ localStorage.removeItem('cur'); location.reload(); };
window.onload=function(){ let c=localStorage.getItem('cur'); if(c){ setTimeout(function(){ window.enter(); },600); } };
</script>
